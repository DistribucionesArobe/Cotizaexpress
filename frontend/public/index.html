      <h1>CotizaBot — cotizaciones y estimates en español, desde tu celular</h1>
      <p>CotizaBot de CotizaExpress es una app en español para hacer cotizaciones y estimates profesionales desde el celular, y un bot de WhatsApp que cotiza solo. Para ferreterías, casas de materiales, distribuidoras y contratistas hispanos en México, Latinoamérica y Estados Unidos (pintura, drywall/tablaroca, techos/roofing, pisos, remodelación, handyman).</p>
      <h2>Funciones</h2>
      <ul>
        <li>Tabla tipo Excel; pegar la lista del cliente o subir foto/screenshot de WhatsApp y se convierte en renglones.</li>
        <li>Materiales y mano de obra separados; IVA o sales tax incluido o agregado.</li>
        <li>Ganancia estimada ("¿Cuánto me queda?") antes de mandar el precio — privada, no sale en el PDF.</li>
        <li>Órdenes de cambio que el cliente aprueba desde su celular.</li>
        <li>PDF con folio y logo, en pesos o dólares, en español o inglés.</li>
        <li>Bot de WhatsApp que contesta y cotiza solo 24/7 con el catálogo del negocio.</li>
      </ul>
      <h2>Precios</h2>
      <p>Cotizador IA: $299 MXN/mes (México) o $15 USD/mes (USA), primera cotización gratis. CotizaBot (bot de WhatsApp): $1,000 MXN o $49 USD al mes. CotizaBot Pro (con cobros): $2,000 MXN o $99 USD al mes. Generador de cotizaciones gratis sin registro.</p>
